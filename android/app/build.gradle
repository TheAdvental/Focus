apply plugin: 'com.android.application'


android {
    namespace 'app.focus'
    compileSdk 36

    defaultConfig {
        applicationId 'app.focus'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The phone shows the very same index.html as the PC and the server: copy it into the app on every build.
tasks.register('copyWebApp', Copy) {
    from '../../index.html'
    into 'src/main/assets'
}
preBuild.dependsOn 'copyWebApp'
