<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Фокус</title>
<link rel="icon" href="icon48.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e10; color: #efe9db;
    font: 18px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center;
    background-image: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%); }
  main { max-width: 540px; padding: 28px; border: 2px solid #efe9db; border-radius: 14px; box-shadow: 6px 6px 0 #000; background: #1a1a1e; }
  img { width: 96px; height: 96px; }
  h1 { font: 700 32px/1.2 "Rockwell", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; margin: 8px 0; }
  #left { font: 700 64px/1.1 "Rockwell", Georgia, serif; font-variant-numeric: tabular-nums; margin: 14px 0; color: #f2b33d; }
  p { color: #a09a8e; margin: 6px 0; }
</style>
</head>
<body>
<main>
  <img src="icon128.png" alt="">
  <h1 id="head"></h1>
  <p id="task"></p>
  <div id="left"></div>
  <p id="site"></p>
  <p id="back"></p>
</main>
<script src="blocked.js"></script>
</body>
</html>
